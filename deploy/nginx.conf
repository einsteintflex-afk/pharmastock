# Alternative reverse proxy (nginx) with a shared per-IP rate limit and HTTPS.
# Certificates: e.g. certbot (Let's Encrypt). Replace pharmastock.example.com.

limit_req_zone $binary_remote_addr zone=pharmastock_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pharmastock_login:10m rate=10r/m;

server {
    listen 80;
    server_name pharmastock.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pharmastock.example.com;

    ssl_certificate     /etc/letsencrypt/live/pharmastock.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pharmastock.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    server_tokens off;

    location = /auth/login {
        limit_req zone=pharmastock_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=pharmastock_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
