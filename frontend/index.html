<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaStock</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/app.js"></script>
</head>

<body>

    <!-- SIGN IN -->
    <main id="login" class="login-screen" hidden>
        <form id="login-form" class="login-card" autocomplete="on">
            <div class="brand login-brand">
                <div class="brand-icon" aria-hidden="true">P</div>
                <div>
                    <h1>PharmaStock</h1>
                    <span>Inventory Intelligence</span>
                </div>
            </div>
            <h2>Sign in</h2>
            <div class="field">
                <label for="login-username">Username</label>
                <input id="login-username" name="username" autocomplete="username" required maxlength="50">
            </div>
            <div class="field">
                <label for="login-password">Password</label>
                <input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="200">
            </div>
            <div id="login-error" class="form-error" role="alert" hidden></div>
            <button type="submit" class="refresh-btn primary">Sign in</button>
        </form>
    </main>

    <!-- APPLICATION -->
    <div id="app" class="app" hidden>

        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">P</div>
                <div>
                    <h1>PharmaStock</h1>
                    <span>Inventory Intelligence</span>
                </div>
            </div>

            <nav id="nav-main" aria-label="Main"></nav>

            <div class="sidebar-bottom">
                <nav id="nav-admin" aria-label="Administration"></nav>
                <div id="system-status" class="system-status">
                    <span class="status-dot" aria-hidden="true"></span>
                    <div>
                        <strong>System Online</strong>
                        <small>Checking…</small>
                    </div>
                </div>
            </div>
        </aside>

        <div class="content">
            <div class="session-bar" id="user-box"></div>
            <main id="main" class="main" tabindex="-1"></main>
        </div>
    </div>

    <div id="modal-root"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

</body>
</html>
