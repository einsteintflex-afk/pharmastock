# PharmaStock: PostgreSQL + application + HTTPS proxy + nightly backups.
#
#   cp deploy/env.production.example .env.production   (fill in secrets)
#   docker compose --env-file .env.production up -d --build
#
# Staging uses the same file with deploy/env.staging.example.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?set OWNER_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-pharmastock.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    image: pharmastock:${PHARMASTOCK_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      # Runs as the restricted application role; migrations run as the owner.
      DATABASE_URL: postgresql://pharmastock_app:${APP_DB_PASSWORD}@db:5432/pharmastock
      MIGRATION_DATABASE_URL: postgresql://pharmastock_owner:${OWNER_DB_PASSWORD}@db:5432/pharmastock
      APP_DB_ROLE: pharmastock_app
    networks: [internal]

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      # After the app is healthy, i.e. migrations have been applied.
      app: { condition: service_healthy }
    environment:
      # Read-only role that bypasses row level security (all organizations).
      DATABASE_URL: postgresql://pharmastock_backup:${BACKUP_DB_PASSWORD}@db:5432/pharmastock
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c", "while true; do /bin/sh /usr/local/bin/backup.sh || echo 'BACKUP FAILED'; sleep $$((BACKUP_INTERVAL_HOURS * 3600)); done"]
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
